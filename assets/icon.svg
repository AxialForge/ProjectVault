<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2331"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f9cff"/>
      <stop offset="1" stop-color="#6b7cff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd6c8"/>
      <stop offset="1" stop-color="#1fb3a7"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#7c8cff" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect x="0" y="0" width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="url(#bg)"/>
    <rect width="256" height="256" fill="url(#grid)"/>
  </g>
  <!-- roof -->
  <path d="M128 42 L216 118 L196 118 L128 60 L60 118 L40 118 Z" fill="url(#roof)"/>
  <!-- walls -->
  <path d="M68 116 L128 66 L188 116 L188 204 L68 204 Z" fill="none" stroke="#e6eaf2" stroke-opacity="0.9" stroke-width="8" stroke-linejoin="round"/>
  <!-- drafting triangle inside -->
  <path d="M96 182 L160 182 L160 118 Z" fill="url(#teal)"/>
  <path d="M112 170 L146 170 L146 136 Z" fill="#0f1218" fill-opacity="0.85"/>
  <!-- dimension ticks -->
  <path d="M84 196 H172" stroke="#2fd6c8" stroke-width="4" stroke-linecap="round"/>
  <path d="M84 190 V202 M172 190 V202" stroke="#2fd6c8" stroke-width="4" stroke-linecap="round"/>
</svg>
